name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Before Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Backend Lint
        run: npm --prefix backend run lint

      - name: Backend Test
        run: npm --prefix backend run test

      - name: Backend Build
        run: npm --prefix backend run build

      - name: Frontend Lint
        run: npm --prefix frontend run lint

      - name: Frontend Build
        run: npm --prefix frontend run build

      - name: Dashboard Lint
        run: npm --prefix dashboard run lint

      - name: Dashboard Build
        run: npm --prefix dashboard run build

  deploy:
    name: Trigger Staging Deploy
    runs-on: ubuntu-latest
    needs: verify
    environment: staging

    steps:
      - name: Trigger deploy hooks
        env:
          STAGING_BACKEND_DEPLOY_HOOK_URL: ${{ secrets.STAGING_BACKEND_DEPLOY_HOOK_URL }}
          STAGING_FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.STAGING_FRONTEND_DEPLOY_HOOK_URL }}
          STAGING_DASHBOARD_DEPLOY_HOOK_URL: ${{ secrets.STAGING_DASHBOARD_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          trigger_hook() {
            name="$1"
            url="$2"

            if [ -z "$url" ]; then
              echo "Missing staging deploy hook secret for $name"
              exit 1
            fi

            echo "Triggering $name staging deploy hook..."
            code="$(curl --silent --show-error --location --request POST --max-time 20 --retry 2 \
              --output /dev/null --write-out "%{http_code}" "$url")"

            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "$name hook accepted ($code)"
            else
              echo "$name hook failed ($code)"
              exit 1
            fi
          }

          trigger_hook "backend" "$STAGING_BACKEND_DEPLOY_HOOK_URL"
          trigger_hook "frontend" "$STAGING_FRONTEND_DEPLOY_HOOK_URL"
          trigger_hook "dashboard" "$STAGING_DASHBOARD_DEPLOY_HOOK_URL"

  smoke:
    name: Staging Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    environment: staging

    steps:
      - name: Check API health
        env:
          STAGING_API_HEALTHCHECK_URL: ${{ secrets.STAGING_API_HEALTHCHECK_URL }}
        run: |
          if [ -z "$STAGING_API_HEALTHCHECK_URL" ]; then
            echo "Missing STAGING_API_HEALTHCHECK_URL secret"
            exit 1
          fi

          code="$(curl --silent --show-error --location --max-time 20 --retry 2 \
            --output /dev/null --write-out "%{http_code}" "$STAGING_API_HEALTHCHECK_URL")"
          echo "API health status: $code"
          test "$code" -ge 200 -a "$code" -lt 300

      - name: Check frontend URL
        env:
          STAGING_FRONTEND_URL: ${{ secrets.STAGING_FRONTEND_URL }}
        run: |
          if [ -z "$STAGING_FRONTEND_URL" ]; then
            echo "Missing STAGING_FRONTEND_URL secret"
            exit 1
          fi

          code="$(curl --silent --show-error --location --max-time 20 --retry 2 \
            --output /dev/null --write-out "%{http_code}" "$STAGING_FRONTEND_URL")"
          echo "Frontend status: $code"
          test "$code" -ge 200 -a "$code" -lt 400

      - name: Check dashboard URL
        env:
          STAGING_DASHBOARD_URL: ${{ secrets.STAGING_DASHBOARD_URL }}
        run: |
          if [ -z "$STAGING_DASHBOARD_URL" ]; then
            echo "Missing STAGING_DASHBOARD_URL secret"
            exit 1
          fi

          code="$(curl --silent --show-error --location --max-time 20 --retry 2 \
            --output /dev/null --write-out "%{http_code}" "$STAGING_DASHBOARD_URL")"
          echo "Dashboard status: $code"
          test "$code" -ge 200 -a "$code" -lt 400
