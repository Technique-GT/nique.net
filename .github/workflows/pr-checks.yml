name: PR Checks

on:
  pull_request:
    branches:
      - main
      - deploy
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Backend Lint
        run: npm --prefix backend run lint

      - name: Backend Test
        run: npm --prefix backend run test

      - name: Backend Build
        run: npm --prefix backend run build

      - name: Frontend Lint
        run: npm --prefix frontend run lint

      - name: Frontend Build
        run: npm --prefix frontend run build

      - name: Dashboard Lint
        run: npm --prefix dashboard run lint

      - name: Dashboard Build
        run: npm --prefix dashboard run build
